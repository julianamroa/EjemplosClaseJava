# ==========================================================
# Configuracion de la aplicacion
# ==========================================================

# Puerto en el que corre esta API (Spring Boot). En EC2 normalmente
# se deja en 8080 y se abre ese puerto en el Security Group, o se
# pone un Nginx/ALB delante en el puerto 80/443.
server.port=${SERVER_PORT:8080}

# ----------------------------------------------------------
# Datos del servicio remoto al que esta API va a consultar.
# Se pueden sobreescribir con variables de entorno en EC2,
# sin tener que recompilar el jar:
#   export TARGET_IP=203.0.113.10
#   export TARGET_PORT=80
#   export TARGET_SCHEME=http
# ----------------------------------------------------------
target.scheme=${TARGET_SCHEME:http}
target.ip=${TARGET_IP:127.0.0.1}
target.port=${TARGET_PORT:80}

# Tiempos de espera al llamar al servicio remoto (milisegundos)
target.connect-timeout-ms=${TARGET_CONNECT_TIMEOUT_MS:3000}
target.read-timeout-ms=${TARGET_READ_TIMEOUT_MS:5000}

# Actuator: expone /actuator/health para chequeos de salud (ideal para
# probar que la instancia EC2 esta viva, o para un load balancer futuro)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
